[project]
name = "frontier-research"
version = "1.0.0"
description = "OpenCommons: Distributed Meaning-Indexed Concept Commons, 2-Tool MCP Server, and Minimal 2-Tool MCP Server"
readme = "README.md"
license = { text = "Apache-2.0 AND CC-BY-4.0" }
authors = [
    { name = "The Kardashev Project", email = "SI@kardashevproject.org" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "pytest>=8.2.0",
]

[project.urls]
Homepage = "https://kardashevproject.org/opencommons"
Repository = "https://github.com/kardashevproject/opencommons"

[project.scripts]
opencommons = "frontier_research.commons.harness_cli:main"
opencommons-mcp = "frontier_research.commons.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
